name: Build CropMedic Android release APK

on:
  push:
    branches: [production-v1]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: crop_medic
        run: flutter pub get

      - name: Build Android release APK
        working-directory: crop_medic
        run: flutter build apk --release --dart-define=CROP_MEDIC_API_URL=http://192.168.0.87:8080

      - name: Upload CropMedic release APK
        uses: actions/upload-artifact@v4
        with:
          name: CropMedic-Android-Release
          path: crop_medic/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
